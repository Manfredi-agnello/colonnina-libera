# DA COPIARE nel repository PRIVATO hub-dati (Fase 5), in .github/workflows/.
# Ogni lunedì mattina crea il report della settimana precedente nella cartella report/.
# Usa circa 2-3 minuti a settimana dei 2.000 gratuiti al mese dei repository privati.
#
# Il codice delle analisi si prende dal repository PUBBLICO del sito: sostituisci
# UTENTE/NOME-SITO con il nome vero (es. manfredi/colonnina-libera).

name: report-settimanale

on:
  schedule:
    - cron: '30 6 * * 1'     # lunedì 6:30 UTC (7:30 o 8:30 in Italia)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub-dati

      - uses: actions/checkout@v4
        with:
          repository: UTENTE/NOME-SITO
          path: codice

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q -r codice/requirements.txt

      - name: Report della settimana scorsa
        run: |
          cd codice
          python -m analisi --hub ../hub-dati --uscita ../hub-dati/report/settimana-scorsa-tmp
          nome=$(python -c "from datetime import date,timedelta;d=date.today()-timedelta(days=date.today().weekday()+7);y,w,_=d.isocalendar();print(f'{y}-S{w:02d}')")
          rm -rf "../hub-dati/report/$nome" && mv ../hub-dati/report/settimana-scorsa-tmp "../hub-dati/report/$nome"

      - name: Salva il report
        run: |
          cd hub-dati
          git config user.name  "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add report
          git diff --cached --quiet || { git commit -q -m "report settimanale"; git pull -q --rebase; git push -q; }
