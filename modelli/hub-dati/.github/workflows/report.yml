# DA COPIARE nel repository PRIVATO dell'archivio, in .github/workflows/report.yml (Fase 5).
#
# - Ogni 1° del mese: report del mese appena finito (report/mensili/AAAA-MM/) e riassunto
#   permanente (riassunti/AAAA-MM.json), che resta anche dopo la cancellazione dei dati
#   grezzi (12 mesi). Aggiorna la pagina iniziale del repository (README.md).
# - Su richiesta: scheda Actions -> report -> Run workflow, con le date "dal" e "al"
#   (AAAA-MM-GG). Il report va in report/su-richiesta/<dal>_<al>/. Senza date: mese scorso.
#
# Il codice delle analisi si prende dal repository PUBBLICO del sito.
# Usa pochi minuti al mese dei 2.000 gratuiti dei repository privati.

name: report

on:
  schedule:
    - cron: '30 6 1 * *'     # il 1° di ogni mese alle 6:30 UTC (7:30 o 8:30 in Italia)
  workflow_dispatch:
    inputs:
      dal:
        description: 'Primo giorno (AAAA-MM-GG). Vuoto = mese scorso intero'
        required: false
        default: ''
      al:
        description: 'Ultimo giorno incluso (AAAA-MM-GG)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub-dati
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: Manfredi-agnello/colonnina-libera
          path: codice
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q -r codice/requirements.txt

      - name: Crea il report
        env:
          DAL: ${{ inputs.dal }}
          AL: ${{ inputs.al }}
        run: |
          cd codice
          data='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [ -n "$DAL" ] || [ -n "$AL" ]; then
            if ! [[ "$DAL" =~ $data && "$AL" =~ $data ]]; then
              echo "Date non valide: scrivi entrambe nel formato AAAA-MM-GG (es. 2027-07-01 e 2027-08-31)"; exit 1
            fi
            python -m analisi --hub ../hub-dati --dal "$DAL" --al "$AL" --uscita "../hub-dati/report/su-richiesta/${DAL}_${AL}"
          else
            mese=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
            python -m analisi --hub ../hub-dati --mese "$mese" --salva-riassunto --uscita "../hub-dati/report/mensili/$mese"
          fi
          python -m analisi.indice --hub ../hub-dati

      - name: Salva il report
        # Si riparte sempre da una copia fresca dell'archivio (che intanto riceve dati ogni
        # 5 minuti e una volta al mese viene compattato) e si aggiungono solo i report.
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/salva"
          cp -r hub-dati/report hub-dati/riassunti hub-dati/README.md "$RUNNER_TEMP/salva/" 2>/dev/null || true
          for tentativo in 1 2 3; do
            rm -rf fresco
            git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}" fresco
            cp -r "$RUNNER_TEMP/salva/." fresco/
            cd fresco
            git config user.name  "report-bot"
            git config user.email "report-bot@users.noreply.github.com"
            git add report riassunti README.md
            if git diff --cached --quiet; then echo "niente di nuovo"; exit 0; fi
            git commit -q -m "report $(date -u +%Y-%m-%d)"
            if git push -q; then echo "report salvato"; exit 0; fi
            cd ..
            echo "archivio modificato nel frattempo, riprovo"; sleep 30
          done
          echo "salvataggio del report fallito"; exit 1
